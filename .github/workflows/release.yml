# Builds goft and publishes the binaries.
#
# A push to main publishes a prerelease of that commit; a v* tag creates the
# release for that version. Both publish the same archives, built by the same
# scripts a person would run locally.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Two pushes in quick succession would otherwise race to replace the same
# release, and the loser could leave it holding a mixture of the two builds.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # -race is what catches the mistakes that only appear with workers > 1,
      # which is how anything but a toy job is configured.
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh stamps the version from git describe, which needs the tags.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The version is decided here rather than left to git describe. A v* tag
      # always lands on a commit of main that the push to main has already
      # tagged main-<date>-<commit>, and describe picked that one: v0.2.0 went
      # out stamped and named as a build of main.
      - name: Decide the version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="main-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and package
        run: ./package.sh

      # Cheap proof that what is about to be published is not a broken binary,
      # and that it says the version it is published as: the tests ran against
      # the source, not against this build.
      - name: Check the binary runs and names its version
        run: |
          ./build/linux/amd64/goft version | tee version.txt
          grep -q "^goft ${VERSION} " version.txt

      - name: Publish the release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Download the archive for your platform, unpack it and put \`goft\` on your PATH."
            echo
            echo '```bash'
            echo "tar xzf goft_${TAG}_linux_amd64.tar.gz"
            echo "sudo install goft_${TAG}_linux_amd64/goft /usr/local/bin/"
            echo "goft version"
            echo '```'
            echo
            echo "Verify what you downloaded with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo
            echo "Everything is built with CGO_ENABLED=0, so there is nothing to install alongside it."
          } > notes.md
          gh release create "$TAG" --title "goft $TAG" \
            --notes "$(cat notes.md)" --generate-notes dist/*

      # Every build gets its own tag rather than one being moved along. This
      # repository publishes immutable releases, where the tag of a published
      # release can never be used again — not even after the release is deleted
      # — so the rolling tag this once used could be created exactly once.
      - name: Publish this build of main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          short=$(git rev-parse --short "$SHA")
          tag="$VERSION"
          {
            echo "A build of \`main\`, published on every push. It is not a release:"
            echo "nothing here is supported, and the next commit supersedes it."
            echo "For something stable, take a versioned release instead."
            echo
            echo "Built from ${SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "Verify what you downloaded with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } > notes.md
          gh release create "$tag" --prerelease --latest=false \
            --target "$SHA" --title "main ${short}" \
            --notes "$(cat notes.md)" dist/*

      # One release per push would otherwise pile up unread. The tags stay
      # behind, since an immutable release's tag cannot be removed, but the
      # releases page keeps to the handful anyone might want.
      - name: Retire the older builds of main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "5"
        run: |
          gh release list --limit 100 --json tagName,createdAt,isPrerelease \
            --jq "[.[] | select(.isPrerelease and (.tagName | startswith(\"main-\")))]
                  | sort_by(.createdAt) | reverse | .[${KEEP}:] | .[].tagName" |
            while read -r old; do
              # Tidying up is not worth failing a published build over.
              gh release delete "$old" --yes || echo "could not delete $old"
            done
