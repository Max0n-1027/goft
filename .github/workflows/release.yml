# Builds goft and publishes the binaries.
#
# A push to main updates the rolling latest-main prerelease; a v* tag creates
# the release for that version. Both publish the same archives, built by the
# same scripts a person would run locally.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Two pushes in quick succession would otherwise race to replace the same
# release, and the loser could leave it holding a mixture of the two builds.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # -race is what catches the mistakes that only appear with workers > 1,
      # which is how anything but a toy job is configured.
      - run: go test -race ./...

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # build.sh stamps the version from git describe, which needs the tags.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        run: ./package.sh

      # Cheap proof that what is about to be published is not a broken binary:
      # the tests ran against the source, not against this build.
      - name: Check the binary runs
        run: ./build/linux/amd64/goft version

      - name: Publish the release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "Download the archive for your platform, unpack it and put \`goft\` on your PATH."
            echo
            echo '```bash'
            echo "tar xzf goft_${TAG}_linux_amd64.tar.gz"
            echo "sudo install goft_${TAG}_linux_amd64/goft /usr/local/bin/"
            echo "goft version"
            echo '```'
            echo
            echo "Verify what you downloaded with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo
            echo "Everything is built with CGO_ENABLED=0, so there is nothing to install alongside it."
          } > notes.md
          gh release create "$TAG" --title "goft $TAG" \
            --notes "$(cat notes.md)" --generate-notes dist/*

      - name: Update the rolling build of main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "The latest build of \`main\`, replaced on every push. It is not a release:"
            echo "the commit behind this tag changes, and so does what you downloaded."
            echo "For something stable, take a versioned release instead."
            echo
            echo "Built from ${SHA} on $(date -u +%Y-%m-%dT%H:%M:%SZ)."
            echo
            echo "Verify what you downloaded with \`sha256sum -c SHA256SUMS --ignore-missing\`."
          } > notes.md
          # Deleting first is what moves the tag: a release keeps pointing at
          # the commit its tag was created on, however many times its assets
          # are replaced.
          gh release delete latest-main --yes --cleanup-tag || true
          gh release create latest-main --prerelease --latest=false \
            --target "$SHA" --title "Latest main" \
            --notes "$(cat notes.md)" dist/*
